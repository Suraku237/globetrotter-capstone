name: Trigger Jenkins Frontend Pipeline

on:
  push:
    branches: [main]
    paths:
      - "frontend/fast_travel/**"
  workflow_dispatch:

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins job remotely
        run: |
          curl -X POST \
            "${{ secrets.JENKINS_URL }}/job/frontend-deploy/build?token=${{ secrets.JENKINS_FRONTEND_TRIGGER_TOKEN }}" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --fail --silent --show-error
