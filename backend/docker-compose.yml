version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - /app/data   # keeps your JSON data persistent across rebuilds
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped