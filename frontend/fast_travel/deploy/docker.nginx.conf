server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Revalidate deployment entry points and notification workers.
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|flutter_service_worker\.js|firebase-messaging-sw\.js|version\.json)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(js|mjs|css|wasm|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|otf)$ {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
