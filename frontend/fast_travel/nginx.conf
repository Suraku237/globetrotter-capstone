server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /downloads/ {
        autoindex on;
    }

    # Flutter web is a single-page app — unmatched paths fall back to
    # index.html so client-side routing and hard refreshes don't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
