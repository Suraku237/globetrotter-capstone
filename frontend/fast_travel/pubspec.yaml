name: fast_travel
description: "GlobeTrotter — a travel planner for Cameroon (mobile, desktop, web)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.2

  # ✅ MAP AND ROUTING PACKAGES
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^11.1.0
  url_launcher: ^6.3.0  # ✅ NEW: Added to open external maps
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  video_player: ^2.9.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  maplibre_gl: ^0.26.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

# Generated via `dart run flutter_launcher_icons` — not loaded through
# Flutter's asset bundle, so assets/images/ doesn't need to be listed
# above for this to work.
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#FF6A4D"

# Generated via `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  android: true
  ios: false
  web: true