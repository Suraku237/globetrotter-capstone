name: fast_travel
description: "GlobeTrotter — a travel planner for Cameroon (mobile, desktop, web)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.2

  # ✅ NEW FREE OPENSTREETMAP PACKAGES (No credit card needed)
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/