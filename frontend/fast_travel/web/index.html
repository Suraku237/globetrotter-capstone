<!DOCTYPE html><html><head>
  <meta charset="UTF-8">
  <title>GlobeTrotter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Required by maplibre_gl on web (maplibre-gl-js) — version must match
       the maplibre_gl_web package version pinned in pubspec.yaml. -->
  <script src="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background-color: #F3F0E1; }
    /* 100vh on mobile Safari includes space actually covered by its
       address/toolbar UI, which pushes bottom-anchored content (the post
       action rail, captions) out of the visible area. 100dvh accounts for
       the browser chrome; 100vh stays as a fallback for browsers that
       don't support dvh yet. */
    #flutter_target { width: 100vw; height: 100vh; height: 100dvh; }
  </style>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <div id="flutter_target"></div>
  <script>
    let callPushWorkerRegistration = Promise.resolve(null);
    if ('serviceWorker' in navigator && window.isSecureContext) {
      callPushWorkerRegistration = navigator.serviceWorker.register('./firebase-messaging-sw.js', {
        scope: './firebase-cloud-messaging-push-scope'
      }).catch(() => {
        console.warn('Call notification service worker is unavailable.');
        return null;
      });
    }
    window.globetrotterCallPush = {
      async setEnabled(enabled) {
        const registration = await callPushWorkerRegistration;
        if (!registration) {
          if (enabled) throw new Error('Call notification worker unavailable');
          return;
        }
        const worker = registration.active || registration.waiting || registration.installing;
        if (!worker) throw new Error('Call notification worker unavailable');
        if (worker.state !== 'activated') {
          await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('Call worker activation timed out')), 5000);
            worker.addEventListener('statechange', () => {
              if (worker.state === 'activated') { clearTimeout(timeout); resolve(); }
              if (worker.state === 'redundant') { clearTimeout(timeout); reject(new Error('Call worker failed')); }
            });
          });
        }
        await new Promise((resolve, reject) => {
          const channel = new MessageChannel();
          const timeout = setTimeout(() => { channel.port1.close(); reject(new Error('Call worker update timed out')); }, 5000);
          channel.port1.onmessage = event => {
            clearTimeout(timeout);
            channel.port1.close();
            if (event.data?.ok) resolve();
            else reject(new Error('Call worker update failed'));
          };
          const currentEnabled = localStorage.getItem('flutter.call_push_enabled') === 'true';
          worker.postMessage({type: 'call_push_enabled', enabled: currentEnabled}, [channel.port2]);
        });
      }
    };
    // shared_preferences_web writes this key through Storage.setItem. The
    // browser's storage event excludes the writing tab, so observe only this
    // one key locally as well as cross-tab updates. Never inspect auth tokens.
    const syncCallPushDelivery = () => {
      try {
        window.globetrotterCallPush.setEnabled(
          localStorage.getItem('flutter.call_push_enabled') === 'true'
        ).catch(() => console.warn('Call notification delivery settings could not be synchronized.'));
      } catch (_) {
        console.warn('Local call notification settings are unavailable.');
      }
    };
    const storageSetItem = Storage.prototype.setItem;
    const storageRemoveItem = Storage.prototype.removeItem;
    Storage.prototype.setItem = function(key, value) {
      storageSetItem.call(this, key, value);
      if (this === localStorage && key === 'flutter.call_push_enabled') syncCallPushDelivery();
    };
    Storage.prototype.removeItem = function(key) {
      storageRemoveItem.call(this, key);
      if (this === localStorage && key === 'flutter.call_push_enabled') syncCallPushDelivery();
    };
    window.addEventListener('storage', event => {
      if (event.key === 'flutter.call_push_enabled' || event.key === null) syncCallPushDelivery();
    });
    syncCallPushDelivery();
    // This loads your Flutter app
    var serviceWorkerUrl = "flutter_service_worker.js?v=" + Date.now();
    // The actual main.dart.js entry point
    var script = document.createElement('script');
    script.src = "main.dart.js";
    script.type = "application/javascript";
    document.body.appendChild(script);
  </script>

</body></html>
