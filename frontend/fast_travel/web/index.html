<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GlobeTrotter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Required by maplibre_gl on web (maplibre-gl-js) — version must match
       the maplibre_gl_web package version pinned in pubspec.yaml. -->

  <link href='https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css' rel='stylesheet'/>
  <style>
    body { margin: 0; padding: 0; background-color: #F3F0E1; }
    #flutter_target { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="flutter_target"></div>
  <script>
    // This loads your Flutter app
    var serviceWorkerUrl = "flutter_service_worker.js?v=" + Date.now();
    // The actual main.dart.js entry point
    var script = document.createElement('script');
    script.src = "main.dart.js";
    script.type = "application/javascript";
    document.body.appendChild(script);
  </script>
</body>
</html>
