services:
  auth-service:
    build:
      context: ./auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      # Empty-string fallback here would override models.py's own sensible
      # default with "" (an env var that's *set but empty* wins over
      # Python's os.getenv default) — that's what was producing
      # domain-less "/admin-requests/..." links in approval emails.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://fasttravel-web.duckdns.org/api}
    volumes:
      - ./shared/data:/app/data
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped

  data-service:
    build:
      context: ./data-service
    env_file:
      # Explicitly loading .env — the top-level `${GEMINI_API_KEY:-}`
      # substitution alone silently falls back to an empty string when
      # the shell running `docker compose` doesn't already have the var
      # exported, which is easy to miss and shows up as a 503 from
      # /assistant/chat. env_file guarantees the container itself
      # receives whatever is in .env.
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/fcm-service-account.json
      CALLS_PUBLIC_APP_URL: ${CALLS_PUBLIC_APP_URL:-https://fasttravel-web.duckdns.org}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_VOIP_TOPIC: ${APNS_VOIP_TOPIC:-}
      APNS_KEY_FILE: /run/secrets/apns/AuthKey.p8
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-production}
    volumes:
      - ./shared/data:/app/data
      - ./firebase-service-account.json:/run/secrets/fcm-service-account.json:ro
      - ./secrets/apns:/run/secrets/apns:ro
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      DATA_SERVICE_URL: http://data-service:8000
    depends_on:
      - auth-service
      - data-service
    restart: unless-stopped
