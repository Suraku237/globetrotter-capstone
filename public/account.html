<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VulnBank | My Account</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">🏦 VulnBank</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="account.html">My Account</a>
      <a href="transfer.html">Transfer Money</a>
      <a href="tools.html">Tools</a>
      <a href="admin.html">Admin</a>
      <a href="#" id="logoutLink">Logout</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h3>Account Profile</h3>
      <label>Account ID</label>
      <input type="text" id="accIdInput" value="1">
      <button onclick="loadProfile()">Load</button>
      <div id="profileResult" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h3>Community Notes</h3>
      <div id="commentsList"></div>
      <label>Add a note</label>
      <textarea id="commentBody" rows="3"></textarea>
      <button onclick="postComment()">Post</button>
    </div>
  </div>

  <footer>&copy; 2026 VulnBank. All rights reserved.</footer>

  <script src="js/auth.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
