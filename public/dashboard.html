<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VulnBank | Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">🏦 VulnBank</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="account.html">My Account</a>
      <a href="transfer.html">Transfer Money</a>
      <a href="tools.html">Tools</a>
      <a href="admin.html">Admin</a>
      <a href="#" id="logoutLink">Logout</a>
    </nav>
  </header>

  <div class="container">
    <div class="balance-box">
      <div>Welcome, <span id="fullName">...</span></div>
      <div class="amount">$<span id="balance">0.00</span></div>
      <div style="font-size:12px;opacity:.8">Account ID: <span id="accountId"></span></div>
    </div>

    <div class="card">
      <h3>Recent Transactions</h3>
      <label>Search by note</label>
      <input type="text" id="searchBox" placeholder="Search transactions...">
      <button onclick="loadTransactions()">Search</button>
      <table id="txTable">
        <thead><tr><th>From</th><th>To</th><th>Amount</th><th>Note</th><th>Date</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <footer>&copy; 2026 VulnBank. All rights reserved.</footer>

  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
