<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VulnBank | Tools</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">🏦 VulnBank</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="account.html">My Account</a>
      <a href="transfer.html">Transfer Money</a>
      <a href="tools.html">Tools</a>
      <a href="admin.html">Admin</a>
      <a href="#" id="logoutLink">Logout</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h3>Network Diagnostics</h3>
      <label>Host</label>
      <input type="text" id="hostInput" value="127.0.0.1">
      <button onclick="doPing()">Ping</button>
      <pre id="pingResult" style="white-space:pre-wrap;background:#222;color:#0f0;padding:10px;border-radius:6px;margin-top:10px"></pre>
    </div>

    <div class="card">
      <h3>Download Statement</h3>
      <label>Statement file name</label>
      <input type="text" id="fileInput" value="welcome.txt">
      <button onclick="getStatement()">View</button>
      <pre id="statementResult" style="white-space:pre-wrap;background:#f8f9fa;padding:10px;border-radius:6px;margin-top:10px"></pre>
    </div>

    <div class="card">
      <h3>Help Center Search</h3>
      <label>Search term</label>
      <input type="text" id="helpQuery" placeholder="Search help articles...">
      <button onclick="openHelp()">Search</button>
    </div>
  </div>

  <footer>&copy; 2026 VulnBank. All rights reserved.</footer>

  <script src="js/auth.js"></script>
  <script src="js/tools.js"></script>
</body>
</html>
